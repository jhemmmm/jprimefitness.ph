services:
  app:
    image: jprimefitnessph-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: jprime-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      # Mounted rather than baked in so tuning changes need a restart, not a rebuild.
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-jprime.conf:ro
    environment: &app-env
      # APP_ENV and APP_DEBUG deliberately come from .env. Setting them here
      # silently overrode the production .env, because Laravel's dotenv is
      # immutable and real environment variables win.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jprimefitness.ph}
      DB_USERNAME: ${DB_APP_USERNAME:-jprime}
      DB_PASSWORD: ${DB_APP_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # cloudflared reaches nginx from the docker bridge. Without trusting it,
      # every visitor looks like the tunnel container and X-Forwarded-Proto is
      # ignored, so Laravel treats an https request as plain http.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jprime

  # Laravel's scheduler (routes/console.php). Without this nothing ticks the
  # hourly/daily panel:* commands on live; sync:* schedules only register on local.
  scheduler:
    image: jprimefitnessph-app
    container_name: jprime-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment: *app-env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - jprime

  node:
    image: node:22-alpine
    container_name: jprime-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    profiles:
      - node
    networks:
      - jprime

  web:
    image: nginx:1.27-alpine
    container_name: jprime-web
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jprime

  mysql:
    image: mysql:8.4
    container_name: jprime-mysql
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jprimefitness.ph}
      MYSQL_USER: ${DB_APP_USERNAME:-jprime}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jprime

  redis:
    image: redis:7-alpine
    container_name: jprime-redis
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - jprime

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jprime-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      # QUIC wants a 7 MB UDP receive buffer; an unprivileged LXC caps it at
      # 416 kB and the tunnel drops connections. Until net.core.rmem_max is
      # raised on the Proxmox host, set TUNNEL_TRANSPORT_PROTOCOL=http2 in .env.
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-quic}
      # Empty = global (nearest edges). Set TUNNEL_REGION=us in .env to pin the
      # tunnel to US data centres, e.g. while Cloudflare's APAC edges are degraded;
      # our ISP hands traffic to LAX anyway, so it costs little.
      TUNNEL_REGION: ${TUNNEL_REGION:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - jprime

volumes:
  mysql_data:
  redis_data:

networks:
  jprime:
    driver: bridge
