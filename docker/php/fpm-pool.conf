; Overrides the php:fpm image default of pm.max_children = 5, which is thin for
; a POS where every open panel tab polls several endpoints on a timer.
; This app sits around 60 MB per child, so 16 children is roughly 1 GB.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500

; Dump a PHP stack trace to the container log for anything over 5s.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
