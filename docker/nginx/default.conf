# cloudflared connects from the docker bridge, so nginx sees the tunnel
# container as the client. Recover the real visitor IP from X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;

    # Every byte here leaves over a home uplink and a Cloudflare tunnel.
    # Cloudflare re-compresses for the browser, but only after it has pulled
    # the raw bytes from us first, so compressing at the origin is what
    # actually shrinks the tunnel transfer.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Vite writes content-hashed filenames, so these can never go stale.
    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Uploads and static images. Falls through to Laravel when the file is
    # missing, so routes that happen to end in an image extension still work.
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|mp4|webm)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Resolve the app container per request via Docker's DNS. A literal
        # hostname is resolved once at startup, so recreating jprime-app (new
        # IP) left nginx 502-ing until it was reloaded.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;

        # Defaults are 4k/8k, small enough that a normal Blade response spills
        # to a temp file on disk before nginx can start sending it.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.ht {
        deny all;
    }
}
